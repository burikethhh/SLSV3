[package]
name = "sls-desktop"
version = "3.0.0"
edition = "2021"

# Slim Tauri v2 shell. Excluded from default workspace build (needs system webview + ort native lib).
# Build: cd desktop && npm run build   (webview vite build + tauri NSIS bundle)
[lib]
name = "sls_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
sha2 = "0.10"
rsa = { version = "0.9", features = ["pem"] }
parking_lot = "0.12"
sls-core = { path = "../../crates/sls-core" }
# Feature-gated heavy deps — default build stays UI + SQLite only:
ort = { version = "2.0.0-rc.13", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
serialport = { version = "4.5", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["rt", "macros", "time"], optional = true }

[features]
# Release flavor = all three: a gate build without face-ort/hardware-serial/cloud-sync
# silently degrades (no recognition, no door, no kill-switch) — default is full.
default = ["face-ort", "hardware-serial", "cloud-sync"]
face-ort = ["dep:ort", "dep:image"]       # YuNet + EdgeFace via ONNX Runtime
hardware-serial = ["dep:serialport"]       # ESP32 gate controller
cloud-sync = ["dep:reqwest", "dep:tokio"]  # PostgREST outbox + kill-switch poll

# Root workspace excludes this crate, so keep the tuned profile here.
[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
rand = "0.8" # license roundtrip test (RsaPrivateKey::new + sign_with_rng)
