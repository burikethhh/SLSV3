<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07090e" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>SLS v3 — Solo Leveling System</title>
  <link rel="icon" href="/icon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="top-progress" class="top-progress" hidden></div>
  <header id="topbar">
    <button id="nav-toggle" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div id="brandbox">
      <div id="brandlogo" aria-hidden="true"><img src="/icon.jpg" alt="SLS Emblem" /></div>
      <div><div id="brand">SLS v3</div><div id="brandsub">SOLO LEVELING SYSTEM</div></div>
    </div>
    <div id="topspacer"></div>
    <div id="user-badge" class="user-badge" hidden>
      <img id="user-avatar" class="user-avatar" src="/avatar.jpg" alt="Hunter Avatar" />
      <span id="user-role-badge" class="stat-badge badge-ultra">S · CEO</span>
    </div>
    <button id="logout" hidden>Sign out</button>
  </header>
  <div id="layout">
    <aside id="sidebar">
      <nav id="nav"></nav>
      <div class="side-foot muted">SLS v3 · Solo Leveling System</div>
    </aside>
    <div id="scrim" hidden></div>
    <main id="view"></main>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
