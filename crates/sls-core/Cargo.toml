[package]
name = "sls-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SLS v3 core domain logic — license, POS cents math, face types, brightness, sync queue (no native deps)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
argon2 = "0.5"
rand = "0.8"
